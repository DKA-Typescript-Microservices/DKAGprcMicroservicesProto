syntax = "proto3";

package transaction.common;

import 'account/account.common.grpc.proto';
import 'enterprise/organization/enterprise.organization.common.grpc.proto';
import 'enterprise/project/enterprise.organization.project.common.grpc.proto';

//###########################################################################
message TransactionCreateResponse {
  bool status = 1;
  int32 code = 2;
  string msg = 3;
  IGTransactionAll data = 4;
}
//###########################################################################
message TransactionReadByIDRequest {
  string id = 1;
}

message TransactionReadByIDResponse {
  bool status = 1;
  int32 code = 2;
  string msg = 3;
  IGTransactionAll data = 4;
}
//###########################################################################
message TransactionReadAllResponse {
  bool status = 1;
  int32 code = 2;
  string msg = 3;
  repeated IGTransactionAll data = 4;
}
//############################################################################################
message TransactionUpdateOneRequestQuery {
  string id = 1;
}
message TransactionUpdateOneRequest {
  TransactionUpdateOneRequestQuery query = 1;
  IGTransaction set = 2;
}
message TransactionUpdateOneResponse {
  bool status = 1;
  int32 code = 2;
  string msg = 3;
  IGTransactionAll data = 4;
}
//############################################################################################
message TransactionDeleteOneRequestQuery {
  string id = 1;
}
message TransactionDeleteOneRequestOption {
  optional bool force = 1;
}

message TransactionDeleteOneRequest {
  TransactionDeleteOneRequestQuery query = 1;
  optional TransactionDeleteOneRequestOption option = 2;
}
message TransactionDeleteOneResponse {
  bool status = 1;
  int32 code = 2;
  string msg = 3;
  IGTransactionAll data = 4;
}
//############################################################################################
//############################################################################################
message SysTime {
  optional int32 unix = 1;
  optional string humanize = 2;
}
//############################################################################################

message IGTransaction {
  optional string reference = 1;
  optional string organization = 2;
  optional string project = 3;
  optional string costumer = 4;
  string invoice = 5;
}

message IGTransactionAll {
  optional string id = 1;
  optional account.common.IAccount reference = 2;
  optional organization.common.EnterpriseOrganization organization = 3;
  optional project.common.EnterpriseOrganizationProject project = 4;
  optional string costumer = 5;
  string invoice = 6;
  optional SysTime time_created = 7;
  optional SysTime time_updated = 8;
  optional SysTime time_deleted = 9;
  bool status = 10;
}

