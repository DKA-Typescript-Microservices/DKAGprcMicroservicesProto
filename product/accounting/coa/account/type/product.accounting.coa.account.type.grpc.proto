syntax = "proto3";

package accounting.coa.acct.type;

import 'google/protobuf/empty.proto';
import 'product/accounting/coa/account/type/product.accounting.coa.account.type.common.grpc.proto';

service AccountType {
  rpc Create(common.CoaAccountTypeCreateRequest) returns (common.CoaAccountTypeCreateResponse);
  rpc ReadAll(google.protobuf.Empty) returns (common.CoaAccountTypeReadAllResponse);
  rpc ReadByID(common.CoaAccountTypeReadByIDRequest) returns (common.CoaAccountTypeReadByIDResponse);
  rpc UpdateOne(common.CoaAccountTypeUpdateOneRequest) returns (common.CoaAccountTypeUpdateOneResponse);
  rpc DeleteOne(common.CoaAccountTypeDeleteOneRequest) returns (common.CoaAccountTypeDeleteOneResponse);
}
