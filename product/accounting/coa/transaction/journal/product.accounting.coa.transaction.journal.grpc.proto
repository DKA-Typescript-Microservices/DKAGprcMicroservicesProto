syntax = "proto3";

package accounting.coa.transaction.journal;

import 'google/protobuf/empty.proto';
import 'product/accounting/coa/transaction/journal/product.accounting.coa.transaction.journal.common.grpc.proto';

service TransactionJournal {
  rpc Create(common.CoaTransactionJournalCreateRequest) returns (common.CoaTransactionJournalCreateResponse);
  rpc ReadAll(google.protobuf.Empty) returns (common.CoaTransactionJournalReadAllResponse);
  rpc ReadByID(common.CoaTransactionJournalReadByIDRequest) returns (common.IGCoaTransactionJournal);
  rpc UpdateOne(common.CoaTransactionJournalUpdateOneRequest) returns (common.CoaTransactionJournalUpdateOneResponse);
  rpc DeleteOne(common.CoaTransactionJournalDeleteOneRequest) returns (common.CoaTransactionJournalDeleteOneResponse);
}
