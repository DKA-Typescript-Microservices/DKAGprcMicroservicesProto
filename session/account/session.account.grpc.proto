syntax = "proto3";

package session.account;

import "account/info/account.info.common.grpc.proto";
import "account/credential/account.credential.common.grpc.proto";
import "account/place/account.place.common.grpc.proto";
import "session/account/session.account.common.grpc.proto";

service Session {
  rpc sign(common.IAccount) returns (stream common.AccountAuthorizeResponse);
  rpc verify(common.AccountVerifyTokenRequest) returns (stream common.IAccount);
  rpc refresh(common.AccountRefreshRequest) returns (stream common.AccountAuthorizeResponse);
  rpc revoke(common.AccountVerifyTokenRequest) returns (stream common.AccountRevokeResponse);
}
