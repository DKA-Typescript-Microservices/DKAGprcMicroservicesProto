syntax = "proto3";

package session.enterprise.common;

//############################################################################################
message SysTime {
  optional int32 unix = 1;
  optional string humanize = 2;
}
//############################################################################################
message SessionEnterpriseGenerateCodeRequest {
  optional string id = 1;
  optional string client_id = 2;
  optional string redirect_uri = 3;
  optional string scope = 4;
}
message SessionEnterpriseGenerateCodeResponse {
  string code = 1;
}
//############################################################################################
message IGSessionEnterprise {

}