syntax = "proto3";

package enterprise.common;

import 'enterprise/project/enterprise.organization.project.common.grpc.proto';
import "enterprise/contact/enterprise.contact.common.grpc.proto";

//############################################################################################
message SysTime {
  optional int32 unix = 1;
  optional string humanize = 2;
}
//############################################################################################
message EnterpriseGetClientRequest {
  optional string client_id = 1;
  optional string client_secret = 2;
}

message EnterpriseGetClientResponse {
  optional string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string client_id = 4;
  optional contact.common.EnterpriseContact contact = 5;
  project.common.EnterpriseOrganizationProject project = 6;
  optional SysTime time_created = 7;
  optional SysTime time_updated = 8;
  optional bool status = 9;
}
//############################################################################################
message EnterpriseOrganization {
  optional string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string client_id = 4;
  optional contact.common.EnterpriseContact contact = 5;
  repeated project.common.EnterpriseOrganizationProject project = 6;
  optional SysTime time_created = 7;
  optional SysTime time_updated = 8;
  optional bool status = 9;
}
//############################################################################################
message EnterpriseAccountOwnerRequest {
  optional string reference = 1;
}

message EnterpriseAccountOwnerResponse {
  bool status = 1;
  int64 code = 2;
  string msg = 3;
  repeated EnterpriseOrganization data = 4;
}
