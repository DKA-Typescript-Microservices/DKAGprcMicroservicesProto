syntax = "proto3";

package project.common;

import "enterprise/organization/enterprise.organization.common.grpc.proto";
import "enterprise/contact/enterprise.contact.common.grpc.proto";
//###################################################################################
message EnterpriseOrganizationProjectCreateRequest {
  optional string organization = 1;
  optional string name = 2;
  optional string description = 3;
  optional contact.common.EnterpriseContactCreateRequest contact = 4;
}

message EnterpriseOrganizationProjectCreateResponse {
  bool status = 1;
  int64 code = 2;
  string msg = 3;
  optional EnterpriseOrganizationProject data = 4;
}
//###################################################################################
message EnterpriseOrganizationProjectReadResponse {
  bool status = 1;
  int64 code = 2;
  string msg = 3;
  repeated EnterpriseOrganizationProject data = 4;
  optional EnterpriseOrganizationProjectReadResponseMetadata metadata = 5;
}

message EnterpriseOrganizationProjectReadResponseMetadata {
  optional int64 count = 1;
}
//############################################################################################
message EnterpriseOrganizationProjectReadByIDRequest {
  string id = 1;
}

message EnterpriseOrganizationProjectReadByIDResponse {
  bool status = 1;
  int64 code = 2;
  string msg = 3;
  EnterpriseOrganizationProject data = 4;
}

//############################################################################################
//###################################################################################
message EnterpriseOrganizationProject {
  optional string reference = 1;
  optional organization.common.EnterpriseOrganization organization = 2;
  optional string client_secret = 3 [json_name = "client_secret"];
  optional string name = 4;
  optional string description = 5;
  optional contact.common.EnterpriseContact contact = 6;
  optional string timeCreated = 7;
  optional string timeUpdated = 8;
  optional bool status = 9;
  optional string id = 10;
}