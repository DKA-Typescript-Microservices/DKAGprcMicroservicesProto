syntax = "proto3";

package credential;
import 'account/info/account.info.grpc.proto';
import 'account/place/account.place.grpc.proto';

service Credential {
  rpc Authorization(AccountAuthRequest) returns (stream IAccount);
}

//##################################################################################
message IAccount {
  optional string id = 1;
  optional string reference = 2;
  optional credential.IAccountCredential credential = 3;
  optional info.IAccountInfo info = 4;
  optional place.IAccountPlace place = 5;
}
//##################################################################################
//##################################################################################
message AccountAuthRequest {
  optional string username = 1;
  optional string password = 2;
}
//##################################################################################

message IAccountCredential {
  optional string id = 1;                  // Document ID (_id in MongoDB)
  optional string reference = 2;          // Preference ObjectId (as string)
  optional string parent = 3;              // Parent ObjectId (as string)
  string email = 4;          // First name as string
  string username = 5;           // Last name as string
  optional string password = 6;
}