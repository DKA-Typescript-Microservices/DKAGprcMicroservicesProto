syntax = "proto3";

package account.common;

import "account/info/account.info.common.grpc.proto";
import "account/credential/account.credential.common.grpc.proto";
import "account/place/account.place.common.grpc.proto";

//############################################################################################
message SysTime {
  optional int32 unix = 1;
  optional string humanize = 2;
}
//############################################################################################
//##################################################################################
message IAccount {
  optional string id = 1;
  optional string reference = 2;
  optional credential.common.IAccountCredential credential = 3;
  optional info.common.IAccountInfo info = 4;
  optional place.common.IAccountPlace place = 5;
  optional SysTime time_created = 6;
  optional SysTime time_updated = 7;
  optional SysTime time_deleted = 8;
  bool status = 9;
}
//##################################################################################

message AccountCreateResponse {
  bool status = 1;
  int64 code = 2;
  string msg = 3;
  optional IAccount data = 4;
}

message AccountCreateRequest {
  credential.common.IAccountCredential credential = 1;
  info.common.IAccountInfo info = 2;
  place.common.IAccountPlace place = 3;
}
//##################################################################################
message AccountReadResponseMetadata {
  optional int64 count = 1;
}
message AccountReadResponse {
  bool status = 1;
  int64 code = 2;
  string msg = 3;
  repeated IAccount data = 4;
  optional AccountReadResponseMetadata metadata = 5;
}

message AccountReadRequestQueryWhere {

}

message AccountReadRequestQuery {
  optional AccountReadRequestQueryWhere where = 1;
}

message AccountReadRequestOptions {
  optional int32 limit = 1;
  optional bool allowDiskUse = 2;
}

message AccountReadRequest {
  optional AccountReadRequestQuery query = 1;
  optional AccountReadRequestOptions options = 2;
}
//##################################################################################
message AccountByIDRequest {
  optional string id = 1;
}

message AccountReadByIDResponse {
  bool status = 1;
  int64 code = 2;
  string msg = 3;
  IAccount data = 4;
}

//##################################################################################
message AccountPutOneRequestQuery {
  optional string id = 1;
}

message AccountPutOneRequest {
  AccountPutOneRequestQuery query = 1;
  IAccount set = 2;
}
//##################################################################################
message AccountDeleteOneRequestSet {

}

message AccountDeleteOneRequestQuery {
  optional string id = 1;
}

message AccountDeleteOneRequest {
  AccountDeleteOneRequestQuery query = 1;
}

