syntax = "proto3";

package category;

import "google/protobuf/empty.proto";


service Category {
  rpc Create(CategoryCreateRequest) returns (stream CategoryCreateResponse);
  rpc Read(google.protobuf.Empty) returns (stream CategoryReadResponse);
}

message CategoryModel {
  optional string id = 1;
  optional string reference = 2;
  optional CategoryModel parent = 3;
  string name = 4;
  string description = 5;
  string time_created = 6;
  string time_updated = 7;
}

message CategoryCreateRequest {
  optional CategoryModel parent = 1;
  string name = 2;
  optional string description = 3;
}

message CategoryCreateResponse {
  bool status = 1;
  int64 code = 2;
  string msg = 3;
  optional CategoryModel data = 4;
}

message CategoryReadResponse {
  bool status = 1;
  int64 code = 2;
  string msg = 3;
  repeated CategoryModel data = 4;
}